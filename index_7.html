<title>공치는사이 · 테니스 기록장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f4f8ee; --surface:#ffffff; --surface-2:#eef3e4; --border:#e2e8d6;
  --text:#20261a; --muted:#6c745f; --faint:#9aa286;
  --accent:#8ec81b; --accent-strong:#79ae12; --accent-ink:#213208; --accent-bg:#eef8d4;
  --pink:#ff5fa0; --pink-bg:#ffe4ef; --pink-ink:#a71a5c;
  --blue:#2f6df0;
  --win:#1f9d55; --win-bg:#e4f6eb; --win-ink:#0e5c30;
  --loss:#e0453f; --loss-bg:#fdeae9; --loss-ink:#8f1f1b;
  --gold:#e8a516; --gold-bg:#fdf1d6; --gold-ink:#8a5c00;
  --shadow:0 2px 4px rgba(30,40,15,.05),0 10px 26px rgba(30,40,15,.07);
  --shadow-lg:0 16px 44px rgba(30,40,15,.18);
  --radius:24px;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14160f; --surface:#1f2318; --surface-2:#2a2f1f; --border:#373d29;
  --text:#eef1e4; --muted:#a6ad95; --faint:#787f68;
  --accent:#c4f82a; --accent-strong:#d3ff45; --accent-ink:#1a260a; --accent-bg:#28320f;
  --pink:#ff9ec9; --pink-bg:#331823; --pink-ink:#ffcadf; --blue:#7aa6ff;
  --win:#3ad07f; --win-bg:#16281d; --win-ink:#93f0bd;
  --loss:#ff6f67; --loss-bg:#2d1615; --loss-ink:#ffb3ae;
  --gold:#f2c14e; --gold-bg:#2c2410; --gold-ink:#ffdf94;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.38);
  --shadow-lg:0 18px 52px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#14160f; --surface:#1f2318; --surface-2:#2a2f1f; --border:#373d29;
  --text:#eef1e4; --muted:#a6ad95; --faint:#787f68;
  --accent:#c4f82a; --accent-strong:#d3ff45; --accent-ink:#1a260a; --accent-bg:#28320f;
  --pink:#ff9ec9; --pink-bg:#331823; --pink-ink:#ffcadf; --blue:#7aa6ff;
  --win:#3ad07f; --win-bg:#16281d; --win-ink:#93f0bd;
  --loss:#ff6f67; --loss-bg:#2d1615; --loss-ink:#ffb3ae;
  --gold:#f2c14e; --gold-bg:#2c2410; --gold-ink:#ffdf94;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.38);
  --shadow-lg:0 18px 52px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{position:relative;background:transparent;color:var(--text);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(130% 90% at 100% -8%,var(--accent-bg),transparent 55%),radial-gradient(120% 95% at -10% 108%,var(--pink-bg),transparent 50%)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:840px;margin:0 auto;padding:22px 16px 110px}
.disp{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}
.tnum{font-variant-numeric:tabular-nums}

.head{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.mascot{width:58px;height:58px;flex:none;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.22));animation:bounce 2.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.mascot{animation:none}}
.title{font-size:clamp(28px,7vw,40px);line-height:1;margin:0;letter-spacing:.01em}
.subtitle{color:var(--muted);font-size:13px;margin:5px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conn{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.conn.cloud{background:var(--win-bg);color:var(--win-ink)}
.conn.local{background:var(--gold-bg);color:var(--gold-ink)}
.head .grow{flex:1}
.theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;width:42px;height:42px;font-size:18px;cursor:pointer;flex:none}
.theme-btn:hover{color:var(--text);border-color:var(--faint)}
.setup-banner{background:var(--gold-bg);color:var(--gold-ink);border-radius:14px;padding:11px 15px;font-size:13px;margin-bottom:16px;line-height:1.5}

.tabs{display:flex;gap:6px;background:var(--surface-2);padding:6px;border-radius:999px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-family:"Jua",sans-serif;font-size:16px;padding:11px;border-radius:999px;cursor:pointer;transition:.15s}
.tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.panel[hidden]{display:none}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:15px 15px 13px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-family:"Jua",sans-serif;font-size:30px;line-height:1;margin-top:9px}
.stat .u{font-size:13px;color:var(--faint);margin-left:2px}
.stat.hl{background:linear-gradient(135deg,var(--accent),var(--accent-strong));border-color:transparent}
.stat.hl .k,.stat.hl .u{color:var(--accent-ink);opacity:.8}
.stat.hl .v{color:var(--accent-ink)}

.board-t{font-family:"Jua",sans-serif;font-size:19px;margin:0 0 12px}
.lb{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.lb-row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 15px;box-shadow:var(--shadow)}
.lb-row .rk{font-family:"Jua",sans-serif;font-size:19px;width:30px;text-align:center;color:var(--faint);flex:none}
.lb-row .main{flex:1;min-width:0}
.lb-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lb-row .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

      if(localReason==="config") why="⚠️ 이 파일엔 Firebase 설정이 안 들어있어요. (설정 넣기 전 옛날 파일을 올리신 것 같아요) → Claude가 보낸 최신 index.html을 올려주세요.";
      else if(localReason==="sdk") why="⚠️ Firebase 스크립트를 못 불러왔어요. 인터넷/차단 문제일 수 있어요 — 새로고침해보세요.";
      else if(localReason.indexOf("init:")===0) why="⚠️ Firebase 연결 오류: "+localReason.slice(5);
      else if(localReason.indexOf("read:")===0) why="⚠️ 데이터 읽기 거부됨 (DB 규칙 확인 필요): "+localReason.slice(5);
      else why="지금은 이 기기에만 저장돼요.";
      bn.hidden=false;bn.innerHTML=why;}
  }
  function loadLocal(){try{var ls=JSON.parse(localStorage.getItem(KEY)||"null");if(ls){state.sessions=ls.sessions||[];state.events=ls.events||[];state.roster=ls.roster||{};}}catch(e){}}
  function backup(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
    clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show");},1900);}

  function initStore(){
    if(!configured()){ localReason="config"; mode="local"; loadLocal(); }
    else if(!window.firebase){ localReason="sdk"; mode="local"; loadLocal(); }
    else {
      try{
        firebase.initializeApp(FIREBASE_CONFIG);
        dbref=firebase.database().ref("groups/"+GROUP_ID);
        mode="cloud";
        dbref.on("value",function(snap){var v=snap.val()||{};
          state.sessions=objToArr(v.sessions);state.events=objToArr(v.events);state.roster=v.roster||{};render();},
          function(err){localReason="read:"+(err&&err.message||err);mode="local";setConn();});
      }catch(e){localReason="init:"+(e&&e.message||e);mode="local";loadLocal();}
    }
    setConn();
    if(mode!=="cloud") render();
  }
  function saveItem(kind,rec){ // kind: 'sessions' | 'events'
    if(mode==="cloud"){ dbref.child(kind+"/"+rec.id).set(rec).catch(function(){toast("저장 실패 — 연결을 확인해 주세요");}); }
    else { var arr=state[kind];var i=arr.findIndex(function(x){return x.id===rec.id;});
      if(i>-1)arr[i]=rec;else arr.push(rec);backup();render();toast("이 기기에 저장했어요 ✓"); }
  }
  function removeItem(kind,id){
    if(mode==="cloud"){ dbref.child(kind+"/"+id).remove(); }
    else { state[kind]=state[kind].filter(function(x){return x.id!==id;});backup();render(); }
  }

  // ---------- stats + leaderboard ----------
  function renderStats(){
    var ss=state.sessions,sCount=ss.length,gCount=0,fee=0,players={};
    ss.forEach(function(s){fee+=Number(s.fee)||0;objToArr(s.games).forEach(function(g){gCount++;
      [["a",g.a1],["a",g.a2],["b",g.b1],["b",g.b2]].forEach(function(pr){
        var side=pr[0],nm=(pr[1]||"").trim();if(!nm)return;
        if(!players[nm])players[nm]={g:0,w:0};players[nm].g++;if(g.winner===side)players[nm].w++;});});});
    var pcount=Object.keys(players).length,avg=sCount?Math.round(fee/sCount):0;
    document.getElementById("stats").innerHTML=
      '<div class="stat hl"><div class="k">총 경기</div><div class="v tnum">'+gCount+'<span class="u">경기</span></div></div>'+
      '<div class="stat"><div class="k">참여 선수</div><div class="v tnum">'+pcount+'<span class="u">명</span></div></div>'+
      '<div class="stat"><div class="k">코트비 합계</div><div class="v tnum">'+won(fee)+'<span class="u">원</span></div></div>'+
      '<div class="stat"><div class="k">모임당 평균</div><div class="v tnum">'+won(avg)+'<span class="u">원</span></div></div>';
    var rows=Object.keys(players).map(function(nm){var p=players[nm];
      return {nm:nm,g:p.g,w:p.w,l:p.g-p.w,pct:Math.round(p.w/p.g*100)};});
    rows.sort(function(a,b){if(b.pct!==a.pct)return b.pct-a.pct;if(b.w!==a.w)return b.w-a.w;if(b.g!==a.g)return b.g-a.g;return a.nm<b.nm?-1:1;});
    var board=document.getElementById("board");
    if(!rows.length){board.innerHTML='<h3 class="board-t">🏆 선수별 전적</h3><div class="lb-empty">경기를 추가하면 선수별 승·패 순위가 여기에 쌓여요.</div>';return;}
    var medals=["🥇","🥈","🥉"];
    board.innerHTML='<h3 class="board-t">🏆 선수별 전적</h3><div class="lb">'+rows.map(function(r,i){
      return '<div class="lb-row" data-player="'+esc(r.nm)+'"><span class="rk">'+(medals[i]||(i+1))+'</span><div class="main">'+
        '<div class="top"><span class="nm">'+esc(r.nm)+' <span class="lb-more">상세 ›</span></span><span class="pct">'+r.pct+'%</span></div>'+
        '<div class="bar"><i style="width:'+r.pct+'%"></i></div>'+
        '<div class="rec tnum">'+r.w+'승 '+r.l+'패 · '+r.g+'경기</div></div></div>';}).join("")+'</div>';
  }
  function renderSets(g){var sets=parseSets(g.score);
    if(!sets.length)return g.score?'<div class="gsets"><span class="set">'+esc(g.score)+'</span></div>':'';
    return '<div class="gsets">'+sets.map(function(p){
      return '<span class="set"><b class="'+(p[0]>p[1]?"hi":"")+'">'+p[0]+'</b>-<b class="'+(p[1]>p[0]?"hi":"")+'">'+p[1]+'</b></span>';}).join("")+'</div>';}
  function gameRow(g,i){var aw=g.winner==="a",bw=g.winner==="b";
    return '<div class="game"><div class="gno">경기 '+(i+1)+' <span class="gtype '+(g.type==="doubles"?"dbl":"")+'">'+(g.type==="doubles"?"복식":"단식")+'</span></div>'+

  function metaHTML(s){var t="",place=[s.venue,s.court].filter(Boolean).join(" ");
    if(place)t+='<span class="tag venue">📍 '+esc(place)+'</span>';
    if(s.dur)t+='<span class="tag dur">⏱ '+esc(s.dur)+'</span>';

  function renderEvents(){
    var ev=state.events.slice();

    if(!ev.length){el.innerHTML='<div class="empty"><div class="big">📅</div><p><b>예정된 일정이 없어요</b></p><p>다음 모임 날짜를 등록해봐요!</p></div>';return;}
    var up=ev.filter(function(x){return dayDiff(x.date)>=0;}).sort(byDateAsc);
    var past=ev.filter(function(x){return dayDiff(x.date)<0;}).sort(byDateDesc);
    function card(x){var dd=ddText(x.date),diff=dayDiff(x.date);
      var cls="card ev"+(diff===0?" today":"")+(diff<0?" past":"");
      var meta="",place=[x.venue,x.court].filter(Boolean).join(" ");

      if(Number(x.fee)>0)meta+='<span class="tag fee">💰 '+won(x.fee)+'원</span>';
      if(x.memo)meta+='<span class="tag memo">'+esc(x.memo)+'</span>';
      var att=x.attend||{},members=rosterList(),goN=0,noN=0;
      members.forEach(function(m){if(att[m]==="yes")goN++;else if(att[m]==="no")noN++;});
      var memHtml=members.map(function(m){var st=att[m],c=st==="yes"?"go":st==="no"?"no":"";
        return '<button class="mem '+c+'" data-ev="'+x.id+'" data-mem="'+esc(m)+'">'+(st==="yes"?"🎾 ":st==="no"?"✕ ":"")+esc(m)+'</button>';}).join('');
      var attHtml='<div class="attend"><div class="att-head">참석 <b>'+goN+'</b>'+(noN?' · 불참 '+noN:'')+(members.length?' <span class="att-sub">('+members.length+'명 중)</span>':'')+'</div>'+
        '<div class="att-members">'+(members.length?memHtml:'<span class="att-sub">아직 멤버가 없어요</span>')+'<button class="mem add" data-addev="'+x.id+'">＋ 멤버</button></div>'+
        '<div class="att-hint">이름을 눌러 참석 → 불참 → 미정</div>'+
        (goN>=4?'<button class="btn-team" data-team="'+x.id+'">🎲 참석자로 팀 짜기</button>':'')+'</div>';
      return '<article class="'+cls+'"><div class="dday"><div class="d">'+dd.d+'</div><div class="lbl">'+dd.l+'</div></div>'+
        '<div class="div"></div><div class="info">'+
        '<div class="when">'+fmtDate(x.date)+(x.time?'<span class="time">'+esc(fmtTime(x.time)+(x.etime?" ~ "+fmtTime(x.etime):""))+'</span>':'')+'</div>'+
        (meta?'<div class="meta">'+meta+'</div>':'')+attHtml+'</div>'+
        '<div class="acts"><button class="icon-btn" data-ee="'+x.id+'" aria-label="수정">'+ICON_EDIT+'</button>'+
        '<button class="icon-btn del" data-de="'+x.id+'" aria-label="삭제">'+ICON_DEL+'</button></div></article>';}
    var html=up.map(card).join("");
    if(past.length)html+='<div class="past-label">지난 일정</div>'+past.map(card).join("");
    el.innerHTML=html;
  }

    document.getElementById("ov").addEventListener("click",function(e){if(e.target.id==="ov")close();});
    document.getElementById("e_save").addEventListener("click",function(){
      var date=document.getElementById("e_date").value;if(!date){toast("날짜를 입력해 주세요");return;}
      var rec={id:ed?ed.id:uid(),created:ed?ed.created:Date.now(),date:date,
        time:document.getElementById("e_time").value,etime:document.getElementById("e_etime").value,
        venue:document.getElementById("e_venue").value.trim(),
        court:document.getElementById("e_court").value.trim(),
        fee:(document.getElementById("e_fee").value.replace(/[^0-9]/g,""))||"",
        memo:document.getElementById("e_memo").value.trim()};
      close();saveItem("events",rec);
    });
    setTimeout(function(){document.getElementById("e_venue").focus();},60);
  }

  document.getElementById("addMatch").addEventListener("click",function(){openSessionForm(null);});
  document.getElementById("addEvent").addEventListener("click",function(){openEventForm(null);});
  document.getElementById("sessionList").addEventListener("click",function(e){
    var em=e.target.closest("[data-em]"),dm=e.target.closest("[data-dm]");
    if(em){var r=state.sessions.find(function(x){return x.id===em.getAttribute("data-em");});if(r)openSessionForm(r);}
    else if(dm){var id=dm.getAttribute("data-dm");var r=state.sessions.find(function(x){return x.id===id;});
      confirmModal((r?fmtDate(r.date):"이")+" 기록을 삭제할까요? (그날 경기 전부 삭제돼요)",function(){removeItem("sessions",id);});}
  });
  function knownPlayers(){var set={};state.sessions.forEach(function(s){objToArr(s.games).forEach(function(g){
    [g.a1,g.a2,g.b1,g.b2].forEach(function(n){n=(n||"").trim();if(n)set[n]=1;});});});return Object.keys(set).sort();}
  function saveAttend(id,name,status){name=(name||"").trim();if(!name)return;
    if(mode==="cloud"){dbref.child("events/"+id+"/attend/"+name).set(status||null).catch(function(){toast("저장 실패 — 연결 확인");});}
    else{var e=state.events.find(function(x){return x.id===id;});if(e){if(!e.attend)e.attend={};if(status)e.attend[name]=status;else delete e.attend[name];backup();render();}}}
  function rosterList(){var set={};
    Object.keys(state.roster||{}).forEach(function(n){if(n)set[n]=1;});
    state.sessions.forEach(function(s){objToArr(s.games).forEach(function(g){[g.a1,g.a2,g.b1,g.b2].forEach(function(n){n=(n||"").trim();if(n)set[n]=1;});});});
    state.events.forEach(function(e){Object.keys(e.attend||{}).forEach(function(n){if(n)set[n]=1;});});
    return Object.keys(set).sort();}
  function addMember(name){name=(name||"").trim();if(!name)return;
    if(mode==="cloud"){dbref.child("roster/"+name).set(true).catch(function(){toast("저장 실패");});}
    else{if(!state.roster)state.roster={};state.roster[name]=true;backup();render();}}
  function cycleAttend(eid,name){var ev=state.events.find(function(x){return x.id===eid;});
    var cur=ev&&ev.attend?ev.attend[name]:undefined;
    var next=cur==="yes"?"no":cur==="no"?null:"yes";
    saveAttend(eid,name,next);}
  function openAddMember(){
    var root=document.getElementById("modalRoot");
    root.innerHTML='<div class="overlay" id="ov"><div class="sheet confirm" role="dialog" aria-modal="true">'+
      '<h2>멤버 추가</h2><p class="lead">모임 멤버 이름을 넣으면 참석 체크에 나와요</p>'+
      '<div class="field"><input id="newmem" placeholder="이름 입력" autocomplete="off"></div>'+
      '<div class="actions"><button class="btn btn-ghost" id="nm_cancel">취소</button><button class="btn btn-primary" id="nm_add">추가</button></div></div></div>';
    function close(){root.innerHTML="";}
    document.getElementById("nm_cancel").addEventListener("click",close);
    document.getElementById("ov").addEventListener("click",function(e){if(e.target.id==="ov")close();});
    document.getElementById("nm_add").addEventListener("click",function(){var n=document.getElementById("newmem").value.trim();if(!n){toast("이름을 입력해 주세요");return;}addMember(n);close();});
    setTimeout(function(){document.getElementById("newmem").focus();},60);
  }
  function allStats(){var players={};
    state.sessions.forEach(function(s){objToArr(s.games).forEach(function(g){
      [["a",g.a1],["a",g.a2],["b",g.b1],["b",g.b2]].forEach(function(pr){var side=pr[0],nm=(pr[1]||"").trim();if(!nm)return;
        if(!players[nm])players[nm]={g:0,w:0};players[nm].g++;if(g.winner===side)players[nm].w++;});});});
    return players;}
  function makeTeams(names){var st=allStats();
    var arr=names.map(function(n){var p=st[n]||{g:0,w:0};var pct=p.g?p.w/p.g*100:50;return {n:n,r:pct+Math.random()*12};});
    arr.sort(function(a,b){return b.r-a.r;});
    var courts=[],i=0;
    while(i+4<=arr.length){var q=arr.slice(i,i+4);courts.push({A:[q[0].n,q[3].n],B:[q[1].n,q[2].n]});i+=4;}
    return {courts:courts,rest:arr.slice(i).map(function(x){return x.n;})};}
  function openTeamMaker(ev){
    var att=ev.attend||{},go=Object.keys(att).filter(function(n){return att[n]==="yes";});
    if(go.length<4){toast("참석 4명 이상일 때 가능해요");return;}
    var root=document.getElementById("modalRoot");
    function draw(){
      var t=makeTeams(go);
      var courtsHtml=t.courts.map(function(c,i){
        return '<div class="tm-court"><div class="tm-cn">'+(t.courts.length>1?"코트 "+(i+1):"추천 대진")+'</div>'+
          '<div class="tm-vs"><div class="tm-team">'+c.A.map(esc).join(" · ")+'</div><span class="tm-x">VS</span><div class="tm-team">'+c.B.map(esc).join(" · ")+'</div></div></div>';}).join("");
      var restHtml=t.rest.length?'<div class="tm-rest">🪑 대기: '+t.rest.map(esc).join(", ")+'</div>':"";
      root.innerHTML='<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>🎲 팀 짜기</h2><p class="lead">참석 '+go.length+'명 · 승률 기준 균형 대진</p>'+
        courtsHtml+restHtml+
        '<div class="actions"><button class="btn btn-ghost" id="tm_re">🎲 다시 돌리기</button><button class="btn btn-primary" id="tm_done">닫기</button></div></div></div>';
      document.getElementById("tm_re").addEventListener("click",draw);
      document.getElementById("tm_done").addEventListener("click",function(){root.innerHTML="";});
      document.getElementById("ov").addEventListener("click",function(e){if(e.target.id==="ov")root.innerHTML="";});
    }
    draw();
  }
  function playerDetail(name){
    var opp={},partner={},recent=[],g=0,w=0,sorted=state.sessions.slice().sort(byDateDesc);
    sorted.forEach(function(s){objToArr(s.games).forEach(function(gm){
      var A=[gm.a1,gm.a2].filter(Boolean).map(function(t){return t.trim();}),B=[gm.b1,gm.b2].filter(Boolean).map(function(t){return t.trim();});
      var side=A.indexOf(name)>=0?"a":(B.indexOf(name)>=0?"b":null);if(!side)return;
      var won=gm.winner===side;g++;if(won)w++;
      var mates=(side==="a"?A:B).filter(function(n){return n!==name;}),foes=(side==="a"?B:A);
      mates.forEach(function(t){partner[t]=partner[t]||{g:0,w:0};partner[t].g++;if(won)partner[t].w++;});
      foes.forEach(function(o){opp[o]=opp[o]||{g:0,w:0};opp[o].g++;if(won)opp[o].w++;});
      recent.push({date:s.date,foes:foes.join(" · "),score:gm.score,won:won});});});
    return {opp:opp,partner:partner,recent:recent,g:g,w:w};}
  function openPlayer(name){
    var d=playerDetail(name),root=document.getElementById("modalRoot");
    var nem=null,easy=null;
    Object.keys(d.opp).forEach(function(o){var l=d.opp[o].g-d.opp[o].w,ww=d.opp[o].w;
      if(!nem||l>nem.l||(l===nem.l&&d.opp[o].g>nem.total))nem={n:o,l:l,total:d.opp[o].g,w:ww};
      if(!easy||ww>easy.w||(ww===easy.w&&d.opp[o].g>easy.total))easy={n:o,w:ww,total:d.opp[o].g,l:l};});
    var bp=null;Object.keys(d.partner).forEach(function(t){var p=d.partner[t],pct=p.w/p.g;
      if(!bp||pct>bp.pct||(pct===bp.pct&&p.w>bp.w))bp={n:t,pct:pct,w:p.w,g:p.g};});
    var oppKeys=Object.keys(d.opp).sort(function(a,b){return d.opp[b].g-d.opp[a].g;});
    root.innerHTML='<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">'+
      '<h2>'+esc(name)+'</h2>'+
      '<div class="pd-hero"><div class="pd-lbl">전체 전적</div><div class="pd-rec">'+d.w+'승 '+(d.g-d.w)+'패 <span style="color:var(--accent-strong)">'+(d.g?Math.round(d.w/d.g*100):0)+'%</span></div></div>'+
      '<div class="pd-cards">'+
        '<div class="pd-card"><div class="pd-lbl">😈 천적</div><div class="pd-val">'+(nem&&nem.l>0?esc(nem.n):"없음")+'</div><div class="pd-sub">'+(nem&&nem.l>0?nem.w+"승 "+nem.l+"패":"아직 없어요")+'</div></div>'+
        '<div class="pd-card"><div class="pd-lbl">😎 만만한 상대</div><div class="pd-val">'+(easy&&easy.w>0?esc(easy.n):"없음")+'</div><div class="pd-sub">'+(easy&&easy.w>0?easy.w+"승 "+easy.l+"패":"아직 없어요")+'</div></div>'+
        '<div class="pd-card"><div class="pd-lbl">🤝 최고의 파트너</div><div class="pd-val">'+(bp?esc(bp.n):"없음")+'</div><div class="pd-sub">'+(bp?"같이 "+bp.w+"승 "+(bp.g-bp.w)+"패":"복식 기록 필요")+'</div></div>'+
      '</div>'+
      (oppKeys.length?'<div class="pd-sec">상대 전적</div>'+oppKeys.map(function(o){return '<div class="pd-row"><span>'+esc(o)+'</span><span class="tnum">'+d.opp[o].w+'승 '+(d.opp[o].g-d.opp[o].w)+'패</span></div>';}).join(""):"")+
      (d.recent.length?'<div class="pd-sec">최근 경기</div><div class="pd-recent">'+d.recent.slice(0,6).map(function(r){return '<div class="pd-rg"><span class="pd-badge '+(r.won?"w":"l")+'">'+(r.won?"승":"패")+'</span><span class="pd-foe">vs '+esc(r.foes||"?")+'</span><span class="pd-sc">'+esc(r.score||"")+'</span></div>';}).join("")+'</div>':"")+
      '<div class="actions"><button class="btn btn-primary" id="pd_done">닫기</button></div></div></div>';
    document.getElementById("pd_done").addEventListener("click",function(){root.innerHTML="";});
    document.getElementById("ov").addEventListener("click",function(e){if(e.target.id==="ov")root.innerHTML="";});
  }
  document.getElementById("board").addEventListener("click",function(e){var row=e.target.closest("[data-player]");if(row)openPlayer(row.getAttribute("data-player"));});
  document.getElementById("eventList").addEventListener("click",function(e){
    var mem=e.target.closest("[data-mem]"),addm=e.target.closest("[data-addev]"),tm=e.target.closest("[data-team]"),ee=e.target.closest("[data-ee]"),de=e.target.closest("[data-de]");
    if(mem){cycleAttend(mem.getAttribute("data-ev"),mem.getAttribute("data-mem"));}
    else if(addm){openAddMember();}
    else if(tm){var rt=state.events.find(function(x){return x.id===tm.getAttribute("data-team");});if(rt)openTeamMaker(rt);}
    else if(ee){var r=state.events.find(function(x){return x.id===ee.getAttribute("data-ee");});if(r)openEventForm(r);}
    else if(de){var id=de.getAttribute("data-de");confirmModal("이 일정을 삭제할까요?",function(){removeItem("events",id);});}
  });
  function setTab(t){document.querySelectorAll(".tabs button").forEach(function(b){b.classList.toggle("active",b.dataset.tab===t);});
    document.getElementById("panelRecord").hidden=(t!=="record");document.getElementById("panelSched").hidden=(t!=="sched");}
  document.querySelectorAll(".tabs button").forEach(function(b){b.addEventListener("click",function(){setTab(b.dataset.tab);});});
  function updThemeBtn(){var isDark=document.documentElement.getAttribute("data-theme")!=="light";
    var b=document.getElementById("themeBtn");b.textContent=isDark?"☀️":"🌙";
    b.setAttribute("aria-label",isDark?"라이트 모드로":"다크 모드로");}
  document.getElementById("themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme")||"dark";var next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);updThemeBtn();try{localStorage.setItem(KEY+"-theme",next);}catch(e){}});
  (function(){var stored=null;try{stored=localStorage.getItem(KEY+"-theme");}catch(e){}
    document.documentElement.setAttribute("data-theme",stored||"dark");updThemeBtn();})();

  setTab("record");
  render();
  initStore();
})();
</script>
</body>
</html>
